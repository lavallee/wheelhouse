[project]
name = "sample-admin"
version = "0.1.0"
description = "Sample admin"
requires-python = ">=3.11"
dependencies = ["wheelhouse", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
wheelhouse = { path = "../python", editable = true }

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["backend"]
