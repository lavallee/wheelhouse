[project]
name = "wheelhouse"
version = "0.1.0"
description = "Backend half of the shared admin-tool template: identity, command guards, idempotency, ETags."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = ["starlette>=0.40"]

[project.scripts]
wheelhouse = "wheelhouse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheelhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
